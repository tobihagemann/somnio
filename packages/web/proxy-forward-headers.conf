# The headers every proxied location forwards, shared by `include` so a correction reaches all
# four locations at once — a header missed on `/ws` alone would strip it from exactly the
# long-lived gameplay connection. The compose file mounts it at the path `proxy.example.conf` includes.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
