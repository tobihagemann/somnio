# The WebSocket upgrade block shared by `/ws` and `/admin`. `proxy_read_timeout` is raised well
# past the default 60s because a gameplay connection is long-lived and can sit idle for minutes
# (the server's only periodic broadcast is `dateTick`, minutes apart); at the default the proxy
# would drop players who stood still.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
