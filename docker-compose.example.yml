# Example only. Operators copy + fill in real credentials, populate the sectors volume
# from their asset pack, set `SOMNIO_DATABASE_TLS` to match their Postgres deployment,
# and front this with a TLS-terminating reverse proxy (the server speaks plain HTTP/WS
# inside the container network).
#
# Topology: `proxy` is the only public surface; `server` also publishes 17662 on loopback for the
# wire-conformance CI job. The proxy serves the browser client at `/` and routes
# `/ws`, `/admin`, and `/health` to the gameplay server, which is what makes the client's
# same-origin `wss://<host>/ws` endpoint resolve without any dev-only branch. Production replaces
# this service with Traefik doing the same split.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: somnio
      # Generate with: openssl rand -hex 32
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
      POSTGRES_DB: somnio
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "somnio"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    # Builds the image locally. To run a published build instead, replace this with
    # `image: ghcr.io/tobihagemann/somnio-server:sha-<short>` (the `publish` job in ci.yml).
    #
    # The build-arg default mirrors `web`'s: both Dockerfiles require BUILD_VERSION with no
    # default of their own, so without it the documented one-step `docker compose up --wait` would
    # fail the required-arg guard on a clean checkout. CI passes the commit's short sha.
    build:
      context: .
      args:
        BUILD_VERSION: local
    depends_on:
      db:
        condition: service_healthy
    # Bind to loopback only — the reverse proxy is the public surface. A public bind
    # would expose `/ws` and bearer-gated `/admin` over plaintext, contradicting the
    # documented TLS-at-proxy invariant.
    ports:
      - "127.0.0.1:17662:8080"
    # SOMNIO_HTTP_PORT stays unset so the image ENV is the only source of the 8080 that the
    # `ports` mapping, the healthcheck, and proxy.example.conf assume. Pinning it here would
    # keep CI green if the image lost that ENV and fell back to the code default of 17662.
    environment:
      SOMNIO_DATABASE_URL: postgres://somnio:CHANGE_ME_DB_PASSWORD@db:5432/somnio
      # Local Postgres doesn't terminate TLS; production deployments should leave this
      # unset (or set to `require`) so the connection fails closed if TLS is missing.
      SOMNIO_DATABASE_TLS: disable
      # Generate with: openssl rand -hex 32 — distinct from POSTGRES_PASSWORD above.
      SOMNIO_ADMIN_TOKEN: CHANGE_ME_ADMIN_TOKEN
      SOMNIO_SECTORS_DIR: /opt/somnio/sectors
    # Populate `./sectors` from your asset pack before starting the stack. For a local
    # smoke test against the bundled fixtures, rebuild the image with
    # `docker compose build --build-arg SOMNIO_SECTORS_SOURCE=packages/core/fixtures/sectors`
    # and drop this mount.
    volumes:
      - ./sectors:/opt/somnio/sectors:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    # Builds the browser client locally. To run a published build instead, replace this with
    # `image: ghcr.io/tobihagemann/somnio-web:sha-<short>` (the `publish` job in ci.yml).
    #
    # The context is the repository root and the Dockerfile lives under packages/web/ — the client
    # imports its sibling workspace packages. Create an `assets/` directory before building (empty
    # is fine; it yields placeholder models and unstyled panels), or point it at a somnio-assets
    # checkout for the real pack.
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        BUILD_VERSION: local
    # Not published: the proxy is the only public surface, mirroring production.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

  proxy:
    image: nginx:1.29-alpine
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    # Loopback only. The example ships placeholder secrets and no TLS, so a public bind would
    # expose the bearer-gated /admin route over plaintext.
    ports:
      - "127.0.0.1:17669:8080"
    volumes:
      - ./packages/web/proxy.example.conf:/etc/nginx/conf.d/default.conf:ro
      - ./packages/web/proxy-forward-headers.conf:/etc/nginx/somnio-proxy-forward-headers.conf:ro
      - ./packages/web/proxy-websocket-upgrade.conf:/etc/nginx/somnio-proxy-websocket-upgrade.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  # The migration refuses a database carrying the retired Swift-era schema (`LegacyDatabaseError`);
  # a stack whose volume still holds one needs `docker compose down -v` before `up`.
  db-data:
