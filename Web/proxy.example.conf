# Local stand-in for the production reverse proxy. Serves the browser client at `/` and routes the
# server's paths to the gameplay container, which is the split Traefik performs in production.
#
# The split is the whole point of this file: the client derives its gameplay endpoint from the page
# origin (`wss://<host>/ws`), so `/` and `/ws` have to be the same origin. Without that the client
# would need a dev-only endpoint branch, and the one place a wrong endpoint shows up is production.

upstream somnio_web {
    server web:8080;
}

upstream somnio_server {
    server server:8080;
}

server {
    listen 8080;
    server_name _;

    # WebSocket upgrade. `proxy_read_timeout` is raised well past the default 60s because a
    # gameplay connection is long-lived and idle between the server's 2 Hz broadcasts — at the
    # default the proxy would drop players who stood still for a minute.
    location /ws {
        proxy_pass http://somnio_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Operator CLI. Also a WebSocket upgrade, and the pre-upgrade bearer gate lives in the server —
    # this proxy must forward Authorization rather than strip it.
    location /admin {
        proxy_pass http://somnio_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://somnio_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the static client.
    location / {
        proxy_pass http://somnio_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
