# Static serving for the browser client. Deliberately does **not** proxy `/ws`: the gameplay
# upgrade is routed by whatever sits in front of this container — Traefik in production, the
# `proxy` service in `docker-compose.example.yml` locally — so this image stays a single-purpose
# static server and the same-origin `/ws` contract is satisfied one layer up.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Covers any location that adds no header of its own; the four that do include it again, because
    # nginx discards inherited `add_header` wherever a child sets one. See the file's own comment.
    include /etc/nginx/somnio-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # nginx has no default type for glTF. Without this the browser still loads it (three.js reads
    # the body, not the header), but the Content-Type is wrong in every trace and any future
    # cache or CDN rule keyed on type silently misses.
    types {
        model/gltf-binary  glb;
        model/gltf+json    gltf;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hashed bundle filenames, so a year is safe and a deploy invalidates by name.
    #
    # `add_header` only, no `expires`: the two are not alternatives — `expires` emits its own
    # `Cache-Control` alongside this one, and the response goes out with two conflicting headers.
    location /bundle/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/somnio-security-headers.conf;
    }

    # The asset pack is *not* content-hashed — filenames come from the model registry's stems and
    # are stable across releases. A week keeps the 16 MB of models out of the hot path while
    # bounding how long a replaced texture can linger.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/somnio-security-headers.conf;
    }

    # The entry document must never be cached, or a deploy leaves clients pinned to bundle URLs
    # that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/somnio-security-headers.conf;
    }

    # Single page, no client-side router: anything unknown is genuinely missing, so serve the
    # entry document only for the root and let everything else 404 honestly rather than returning
    # a 200 page for a mistyped asset path.
    location / {
        try_files $uri $uri/ =404;
    }

    location = / {
        # The header is repeated here rather than inherited: `try_files` serves a matched *file* in
        # the current location context, with no internal redirect and no second location lookup, so
        # the `location = /index.html` block below never applies to a request for `/` — which is the
        # only URL a returning visitor actually loads. Without it nginx still emits ETag/Last-Modified,
        # letting a browser reuse a stale document that references removed /bundle/ hashes.
        add_header Cache-Control "no-store";
        include /etc/nginx/somnio-security-headers.conf;
        try_files /index.html =404;
    }
}
