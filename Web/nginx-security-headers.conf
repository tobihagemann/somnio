# Response hardening, factored out because nginx's `add_header` does not merge across blocks: a
# location that sets *any* `add_header` discards every one inherited from its parent. Every
# content-serving location here sets its own `Cache-Control`, so headers declared only at the server
# level would be dropped from every actual response — the same inheritance trap that kept the
# entry document from getting `no-store`. Including this file in each such location is what makes
# the headers real rather than apparent.
#
# This origin stores a 30-day bearer token in `localStorage`, so the cost of any future XSS is a
# long-lived credential rather than a defaced frame. That is what makes a CSP worth having even
# though the primary defence already holds: `Web/src/ui/dom.ts` is the only text-bearing constructor
# and it sets `textContent`, and there is no `innerHTML` anywhere in `Web/src`.
#
# `'self'` throughout costs nothing because the bundle is genuinely self-contained: scripts and
# styles ship hashed under `/bundle/`, the asset pack is same-origin under `/assets/`, and the only
# outbound connection is the gameplay WebSocket to this same host. Three deliberate relaxations:
#
#   - `style-src 'unsafe-inline'`, because the panels set `element.style` directly for HUD bar widths
#     and fill colours.
#   - `blob:` on **both** `img-src` and `connect-src`, which is load-bearing and not obvious.
#     `GLTFLoader` extracts each GLB's embedded textures into `blob:` URLs; three.js then reads them
#     back through `ImageBitmapLoader`, which uses **`fetch()`** — so the governing directive is
#     `connect-src`, not `img-src`. `img-src` is listed too because three.js falls back to an `<img>`
#     via `TextureLoader` where `createImageBitmap` is unavailable, and only one of the two paths runs
#     per browser.
#
#     Getting this wrong fails silently in the worst way: every model still loads its geometry, so the
#     world renders fully built and completely untextured, with no CSP violation logged — only a wall
#     of `THREE.GLTFLoader: Couldn't load texture blob:...`. It cannot reproduce in the dev server,
#     which sends no CSP at all, so it is a production-image-only failure. Verified by `fetch()`ing a
#     blob URL from the served page: blocked before this, 200 after.
#
#     A blob URL is minted by the page itself, so allowing it grants an attacker nothing they do not
#     already have by virtue of running script.
#
# The gameplay WebSocket needs no source of its own. CSP3's scheme-part matching lets `'self'` cover
# the `ws`/`wss` variants of this origin, so the client's origin-relative `wss://<host>/ws` is already
# allowed. Listing bare `ws:`/`wss:` schemes instead would carry no host component and therefore match
# **any** host — turning `connect-src` into an open egress channel for the 30-day token in
# `localStorage`, which is the one thing this header exists to close off. WebKit was the last engine
# not to implement the scheme-part match; that was fixed in 2022 (WebKit bug 235873), well before the
# oldest Safari this client supports.
#
# `frame-ancestors 'none'` replaces X-Frame-Options, and `form-action 'none'` is its companion: it
# does **not** inherit from `default-src`, so without it an injected `<form action="https://...">`
# would be a second exfiltration path beside the WebSocket one.
#
# Traefik also applies `secure-headers@file` in production (HSTS, nosniff, referrer policy). All
# three are set here too so the container is safe behind any front end rather than depending on one
# being configured correctly — duplicates are harmless (a proxy that sets the same header wins or
# matches), while a missing one is only discovered by the attack it would have stopped.
#
# HSTS is the one worth spelling out. This origin persists a 30-day bearer token in `localStorage`,
# so a single plaintext request is enough to hand it over, and a page served without HSTS is one
# `http://` link away from that. The header is emitted unconditionally rather than gated on the
# request having arrived over TLS: this container never terminates TLS (`Web/Dockerfile` serves plain
# HTTP on 8080 behind a proxy), so it cannot tell, and a browser ignores the header on a plaintext
# response by specification — which makes the unconditional form correct rather than merely
# convenient. `includeSubDomains` is deliberately omitted: this image does not know what else lives
# under the parent domain, and claiming for siblings it has never seen would break them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
