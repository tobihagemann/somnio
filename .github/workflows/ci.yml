name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # The root `package.json` scripts are the single definition of each check; the pre-commit
      # hook runs the fixers over staged files only, so this job is the full gate. The unit
      # projects never start a container; the integration projects are the `integration-tests` job.
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test
      # The build ends with the editor-exclusion assertion (`packages/web/scripts/assertEditorExcluded.mjs`).
      - run: npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Docker is reachable
        # Fails the job loudly rather than letting testcontainers time out suite by suite.
        run: docker info -f '{{.ServerVersion}}'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Run integration tests
        run: npm run test:integration

  wire-conformance:
    # Drives the browser client's real encoder and transport into the server image the compose
    # file builds, so the conformance target is the artifact that ships rather than an in-process
    # server.
    name: Wire Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build server image
        # BUILD_VERSION has no default and the build fails without it, so this is a separate
        # step from `up --wait` (which would otherwise reuse a stale image). Named service, so this
        # job does not also build the browser client it has no use for.
        run: docker compose -f docker-compose.example.yml build --build-arg BUILD_VERSION=conformance-test server
      - name: Bring the server up
        # `--no-build` so `up` cannot re-trigger a build: a rebuild here would run without the
        # BUILD_VERSION arg above and fail the Dockerfile's required-arg guard. `server` pulls
        # `db` in through depends_on; the web and proxy services stay down.
        run: docker compose -f docker-compose.example.yml up --no-build --wait --wait-timeout 180 server
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Run wire conformance suite
        env:
          SOMNIO_CONFORMANCE_URL: ws://127.0.0.1:17662/ws
        run: npm run conformance
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.example.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.example.yml down -v

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Create an empty asset pack
        # `packages/web/Dockerfile` COPYs `assets/` from the build context. This job deliberately does *not*
        # check out the private pack: it verifies the topology, and an empty pack still yields a
        # loadable page (placeholder models, unstyled panels). The `publish` job is where the real
        # pack is required.
        run: mkdir -p assets
      - name: Build images
        # Both Dockerfiles require BUILD_VERSION (no default) and fail the build without it.
        # `docker compose build --build-arg` reaches every service whose Dockerfile declares that
        # ARG, which is the server and the browser client.
        run: docker compose -f docker-compose.example.yml build --build-arg BUILD_VERSION=ci-test
      - name: Bring stack up and wait for healthy
        # Gates on every healthcheck (db, server's /health -> SELECT 1, web, proxy), so a boot
        # regression in any of them fails the job. Runs the shipped example file as-is; its
        # placeholder secrets are internally consistent.
        run: docker compose -f docker-compose.example.yml up --wait --wait-timeout 180
      - name: Verify the full topology through the proxy
        # The split routing is the part that can silently break: a rule change that shadows `/ws`
        # takes the game server offline while the site keeps serving perfectly. Assert both legs
        # reach their own upstream through the one published port, and that the bearer gate on
        # `/admin` answers 401 rather than upgrading or 404ing.
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:17669/ | grep -q 'id="somnio-root"'
          curl -fsS http://127.0.0.1:17669/health
          admin=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17669/admin)
          test "$admin" = "401" || (echo "expected 401 from /admin, got $admin" >&2; exit 1)
          # The client's own endpoint resolution is origin-relative, so this is the URL it will
          # dial. A 101 means the upgrade reached the gameplay server, which then holds the
          # socket open for the hello frame — hence the time cap, which curl reports as a
          # non-zero exit after printing the status.
          status=$(curl -s -m 5 -o /dev/null -w '%{http_code}' \
            -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: AAAAAAAAAAAAAAAAAAAAAA==' \
            http://127.0.0.1:17669/ws || true)
          test "$status" = "101" || (echo "expected 101 from /ws, got $status" >&2; exit 1)
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.example.yml ps
          docker compose -f docker-compose.example.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.example.yml down -v

  publish:
    # Every commit on main that passes the four jobs above is published; there is no release step,
    # tag, or version number. Both images carry the same `sha-<short>` tag from one commit (plus
    # `latest`), and a deployment pins that one sha for both, so the server and the client that
    # reach production always come from the same tree.
    name: Publish Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, integration-tests, wire-conformance, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Nothing here pushes to the repository, so the token stays out of .git/config.
          persist-credentials: false
      - name: Check out asset pack
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The runtime pack lives in a separate private repo. The default GITHUB_TOKEN only
          # reaches this repo; ASSETS_DEPLOY_KEY is a read-only SSH deploy key scoped to
          # somnio-assets. `packages/web/Dockerfile` reads the pack from `assets/` in the context.
          repository: tobihagemann/somnio-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: assets
          persist-credentials: false
      - name: Verify the asset pack has what the client needs
        # Fail here rather than shipping a site with unstyled panels. `bundle-web-assets.sh` also
        # hard-fails on a missing UI/ subtree, but that runs inside the image build where the
        # error is buried in build output; this names the problem up front.
        run: |
          for subtree in Web/Models FloorMaterials UI; do
            if [[ ! -d "assets/${subtree}" ]]; then
              echo "ERROR: asset pack is missing ${subtree}/" >&2
              exit 1
            fi
          done
      - name: Resolve the build version
        id: version
        # The short sha is what both Dockerfiles bake in (`SOMNIO_SERVER_VERSION`, the
        # `somnio-web <version>` stamp) and what the image tag carries, so a running container
        # names the commit it was built from.
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the server image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.short }}
          tags: |
            ghcr.io/${{ github.repository }}-server:sha-${{ steps.version.outputs.short }}
            ghcr.io/${{ github.repository }}-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish the web image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          # Repository root, not packages/web/: the client imports its sibling workspace packages
          # through the root `node_modules`, and the asset pack sits at assets/. A package-rooted
          # context cannot see either.
          context: .
          file: ./packages/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.short }}
          tags: |
            ghcr.io/${{ github.repository }}-web:sha-${{ steps.version.outputs.short }}
            ghcr.io/${{ github.repository }}-web:latest
          cache-from: type=gha
          # `mode=min`, unlike the server image's `mode=max`, because this build's context carries
          # the private somnio-assets checkout: `mode=max` exports *every* stage's layers into the
          # Actions cache, including the build stage that copies the pack. GitHub grants a pull
          # request access to caches created on the base branch, including PRs from forks, so
          # that would make the private pack readable from the public repo, which is the exact
          # exposure the deploy-key indirection exists to prevent. The pushed image is unaffected
          # either way (only the nginx stage ships), so this costs only the intermediate-layer
          # reuse, not the npm-install or Vite-build layers.
          cache-to: type=gha,mode=min
